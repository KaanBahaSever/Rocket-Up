<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Rocket-Up logo">
  <title>Rocket-Up</title>
  <defs>
    <radialGradient id="ru-sky" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#26387f"/>
      <stop offset="0.6" stop-color="#141c48"/>
      <stop offset="1" stop-color="#0a0f2a"/>
    </radialGradient>
    <linearGradient id="ru-flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3bf"/>
      <stop offset="0.35" stop-color="#ffd43b"/>
      <stop offset="0.75" stop-color="#ff6b35"/>
      <stop offset="1" stop-color="#ff6b35" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ru-hull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dee2e6"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ced4da"/>
    </linearGradient>
    <clipPath id="ru-badge"><circle cx="256" cy="256" r="240"/></clipPath>
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#ru-sky)"/>
  <g clip-path="url(#ru-badge)" fill="#fff">
    <circle cx="120" cy="120" r="3" opacity=".9"/>
    <circle cx="390" cy="96" r="2.2" opacity=".7"/>
    <circle cx="430" cy="210" r="2.6" opacity=".8"/>
    <circle cx="86" cy="300" r="2" opacity=".6"/>
    <circle cx="170" cy="70" r="1.6" opacity=".6"/>
    <circle cx="350" cy="420" r="2" opacity=".5"/>
    <circle cx="140" cy="410" r="2.4" opacity=".55"/>
    <circle cx="300" cy="60" r="1.5" opacity=".7"/>
  </g>

  <!-- orbit, back half -->
  <path d="M 46 280 A 210 70 0 0 1 466 280" fill="none" stroke="#38d9c9" stroke-width="10" stroke-linecap="round"
        stroke-opacity=".55" transform="rotate(-18 256 280)"/>

  <!-- rocket -->
  <g transform="translate(262 250) rotate(38) scale(0.98)">
    <path d="M -16 96 C -22 132 -9 168 0 205 C 9 168 22 132 16 96 Z" fill="url(#ru-flame)"/>
    <path d="M -34 22 L -74 86 L -74 112 L -34 84 Z" fill="#ff6b35"/>
    <path d="M 34 22 L 74 86 L 74 112 L 34 84 Z" fill="#ff6b35"/>
    <path d="M -22 84 L 22 84 L 16 98 L -16 98 Z" fill="#868e96"/>
    <rect x="-34" y="-60" width="68" height="146" rx="6" fill="url(#ru-hull)"/>
    <path d="M -34 -58 C -34 -110 -12 -142 0 -154 C 12 -142 34 -110 34 -58 Z" fill="#ff6b35"/>
    <rect x="-34" y="52" width="68" height="11" fill="#ff922b"/>
    <circle cx="0" cy="-16" r="18" fill="#141c48"/>
    <circle cx="0" cy="-16" r="12" fill="#38d9c9"/>
    <circle cx="-4" cy="-20" r="4" fill="#e6fcf5" opacity=".9"/>
    <rect x="-5" y="66" width="10" height="44" rx="3" fill="#e8590c"/>
  </g>

  <!-- orbit, front half with a satellite -->
  <g transform="rotate(-18 256 280)">
    <path d="M 466 280 A 210 70 0 0 1 46 280" fill="none" stroke="#38d9c9" stroke-width="10" stroke-linecap="round"/>
    <circle cx="380" cy="336.5" r="11" fill="#ffd43b" stroke="#141c48" stroke-width="4"/>
  </g>
</svg>
